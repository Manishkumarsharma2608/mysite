<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Manish Kumar Sharma</title>
    <link rel="stylesheet" href="CSS/styles.css" />
    <link rel="shortcut icon" href="images/MKS.ico" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css?family=Merriweather|Montserrat|Sacramento&display=swap"
      rel="stylesheet"
    />
  </head>
  
  <body>
      
    <div class="contact-form-headers">
      <img
        class="contact-email-image"
        src="images/Email.png"
        alt="Email icon"
      />
      <h2 class="contact-title">GET IN TOUCH</h2>
      <p class="contact-description">
        Please fill in the details below to reach out
      </p>
    </div>

    <div class="contact-form">
      <!-- Replace YOUR_FORM_ID with the ID from your Formspree dashboard -->
      <form action="https://formspree.io/f/mppdwkly" method="POST" autocomplete="off">
        <div class="input-fields">
          <input
            name="name"
            type="text"
            required
            class="Name"
            placeholder="Name"
            aria-label="Name"
            autocomplete="name"
          />
          <br />
          <input
            name="email"
            type="email"
            required
            class="Email"
            placeholder="Email"
            aria-label="Email"
            autocomplete="email"
          />
          <br />
          <input
            name="phone"
            type="tel"
            class="Phone"
            placeholder="Phone (optional)"
            aria-label="Phone (optional)"
            autocomplete="tel"
          />
          <br />
          <textarea
            required
            name="message"
            class="Message"
            placeholder="Message"
            aria-label="Message"
            cols="30"
            rows="3"
          ></textarea>
          <br />

          <!-- Subject line for the email you receive -->
          <input
            type="hidden"
            name="_subject"
            value="New message from your portfolio"
          />
          <!-- Spam trap: leave empty and hidden -->
          <input
            type="text"
            name="_gotcha"
            style="display: none"
            tabindex="-1"
            autocomplete="off"
          />

          <div class="form-buttons">
            <input type="submit" class="btn" id="sbtbtn" value="SUBMIT" />
            <a class="btn" id="homebtn" href="index.html">&larr; BACK TO HOME</a>
          </div>
        </div>
      </form>
    </div>
    
    <div class="bottom-container">
      <a
        class="footer-link"
        href="https://www.linkedin.com/in/manish-kumar-sharma-01321b16a"
        target="_blank"
        rel="noopener"
        ><img
          class="footer-images"
          src="images/linkedin.png"
          alt="LinkedIn profile"
      /></a>
      <p class="copyright">
        ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        Manish Kumar Sharma.
      </p>
    </div>
    <script>
  window.addEventListener("pageshow", function () {
    var form = document.querySelector("form");
    if (form) form.reset();
  });
</script>
  </body>
</html>
